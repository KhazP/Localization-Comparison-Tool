name: Community Greetings

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    name: First interaction greeting
    runs-on: ubuntu-latest
    steps:
      - name: Send greeting
        uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue in Localization Comparison Tool.
            We appreciate your time and will review this as soon as possible.
            Please include steps to reproduce and screenshots when relevant.
          pr-message: |
            Thanks for your first pull request.
            We appreciate your contribution and will review it soon.
            Please make sure tests and analysis pass and that the PR description is complete.

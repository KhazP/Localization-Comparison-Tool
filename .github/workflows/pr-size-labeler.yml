name: Pull Request Size Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  size-label:
    name: Label PR by size
    runs-on: ubuntu-latest

    steps:
      - name: Label pull request size
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = pr.number;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: issue_number,
              per_page: 100,
            });

            const total = files.reduce((sum, f) => sum + f.additions + f.deletions, 0);

            let label;
            if (total <= 50) label = 'size/xs';
            else if (total <= 200) label = 'size/s';
            else if (total <= 400) label = 'size/m';
            else if (total <= 800) label = 'size/l';
            else label = 'size/xl';

            const palette = {
              'size/xs': '0e8a16',
              'size/s': '6cc644',
              'size/m': 'fbca04',
              'size/l': 'f9d0c4',
              'size/xl': 'b60205',
            };

            const existingLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100,
            });

            const existingNames = new Set(existingLabels.map((l) => l.name));

            for (const [name, color] of Object.entries(palette)) {
              if (!existingNames.has(name)) {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description: 'Automatically assigned pull request size label',
                });
              }
            }

            const currentIssueLabels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const sizeLabels = currentIssueLabels
              .map((l) => l.name)
              .filter((name) => name.startsWith('size/'));

            for (const oldLabel of sizeLabels) {
              if (oldLabel !== label) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: oldLabel,
                });
              }
            }

            if (!sizeLabels.includes(label)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [label],
              });
            }

            core.info(`PR #${issue_number} changed lines: ${total}, assigned label: ${label}`);
